name: PR Checks

on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Create test env file
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> .env
          echo "API_QR_KEY=40064.j69ho9uzUISwAzvS4" >> .env
          echo "SMTP_HOST=smtp.gmail.com" >> .env
          echo "SMTP_PORT=465" >> .env
          echo "FROM_EMAIL=test@example.com" >> .env
          echo "AI_API_KEY=dummy" >> .env
          echo "AI_BASE_URL=http://localhost" >> .env
          echo "AI_MODEL=dummy" >> .env

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Ruff lint
        run: pip install ruff && ruff check src/ tests/ --ignore E711
